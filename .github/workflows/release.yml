name: Release

# A version tag on main, such as v1.0.0, builds every platform's downloads and creates a draft
# GitHub release to check and publish by hand. Running this workflow by hand on main is a dry
# run: it builds, signs, notarizes, and checks everything without creating a release.
#
# The macOS and Windows jobs run in the `release` environment, which holds the signing secrets
# and only admits main and v* tags. Without the secrets the apps are built unsigned, and the
# signing checks report it as such. See docs/RELEASING.md.
#
# A pull request that changes the Windows or Linux packaging builds and checks those downloads
# unsigned, outside the release environment, so packaging changes are tested before they merge.

"on":
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rust/packaging/**
      - rust/scripts/package-windows.ps1
      - rust/scripts/check-windows-packages.ps1
      - rust/scripts/package-linux.sh
      - rust/scripts/check-linux-packages.sh
      - rust/crates/nicegit/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer run waits its turn.
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n1)"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' in rust/Cargo.toml is not a version like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Releases are made from main only, and the tag must name the version being built.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$GITHUB_REF_NAME does not point to a commit on main. Merge to main, then tag there."
              exit 1
            fi
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME does not match version $version in rust/Cargo.toml."
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::notice::Packaging check of v$version: the Windows and Linux downloads are built unsigned and checked."
            publish=false
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "::notice::Dry run of v$version: everything is built and checked, and no release is created."
            publish=false
          else
            echo "::error::Run releases by tagging main, or run this workflow on main for a dry run."
            exit 1
          fi
          # A version with a suffix, such as 1.1.0-rc.1, is a pre-release; 1.0.0 is a full release.
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "### NiceGit v$version (\`${GITHUB_SHA::9}\`)$([ "$publish" = true ] || echo ', dry run')" >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal app
    needs: check
    # macOS packaging has its own scripts and is not built for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      # Notarization signs in with either an App Store Connect API key or an Apple ID.
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Generate the third-party license file
        run: bash rust/scripts/third-party-licenses.sh rust/dist/THIRD_PARTY_LICENSES.txt

      - name: Import signing certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/nicegit-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')

          security import "$cert_path" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$cert_path"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)"
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare the notarization API key
        if: env.NOTARY_KEY_P8 != ''
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        run: bash rust/scripts/package-macos.sh

      - name: Check the signature and notarization
        run: bash rust/scripts/verify-macos.sh "rust/dist/NiceGit-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rust/dist/*.dmg
          if-no-files-found: error

      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    # The release environment holds the optional Windows code-signing certificate. Pull requests
    # cannot use it, so they build unsigned without an environment.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        working-directory: rust
        run: cargo build --release --locked

      # Signs nicegit.exe when a code-signing certificate is set, so Windows SmartScreen shows
      # the publisher. Without one the app is unsigned, as before. See docs/RELEASING.md.
      - name: Sign the app
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        working-directory: rust
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'nicegit-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe was not found' }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 /d NiceGit 'target/release/nicegit.exe'
            if ($LASTEXITCODE -ne 0) { throw 'signing failed' }
            & $signtool.FullName verify /pa 'target/release/nicegit.exe'
            if ($LASTEXITCODE -ne 0) { throw 'the signature did not verify' }
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Note an unsigned build
        if: env.WINDOWS_CERT_PFX == ''
        shell: pwsh
        run: Write-Host "::warning::WINDOWS_CERT_PFX is not set, so nicegit.exe is unsigned."

      - name: Install cargo-about and WiX
        shell: pwsh
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      # The same script as on macOS and Linux, through Git Bash, so every download's file is alike.
      - name: Generate the third-party license file
        shell: bash
        run: bash rust/scripts/third-party-licenses.sh rust/dist/THIRD_PARTY_LICENSES.txt

      - name: Package the zip and installer
        shell: pwsh
        run: pwsh rust/scripts/package-windows.ps1 -Version $env:VERSION -Arch $env:ARCH

      - name: Check the zip and installer
        shell: pwsh
        run: pwsh rust/scripts/check-windows-packages.ps1 -Version $env:VERSION -Arch $env:ARCH

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            rust/dist/*.zip
            rust/dist/*.msi
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Ubuntu 22.04 keeps the downloads working on distributions with glibc 2.35 or newer.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libssl-dev pkg-config xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 file

      - name: Install the packaging tools
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          cargo install cargo-generate-rpm --locked --version 0.21.1
          cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Build
        working-directory: rust
        run: cargo build --release --locked

      - name: Generate the third-party license file
        run: bash rust/scripts/third-party-licenses.sh rust/dist/THIRD_PARTY_LICENSES.txt

      - name: Package the tarball, deb, rpm and AppImage
        run: bash rust/scripts/package-linux.sh "$VERSION"

      - name: Check the packages
        run: bash rust/scripts/check-linux-packages.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.deb
            rust/dist/*.rpm
            rust/dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [check, macos, windows, linux]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" .
          cat SHA256SUMS.txt

      # A draft is checked and published by hand. Running again replaces a draft's files, but a
      # published release is never changed: release a new version instead.
      - name: Create or update the draft release
        working-directory: release
        run: |
          set -euo pipefail
          title="NiceGit $VERSION"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published. Bump the version in rust/Cargo.toml and tag again."
              exit 1
            fi
            echo "Updating the draft $TAG"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --draft --title "$title" --prerelease="$PRERELEASE"
            gh release upload "$TAG" --clobber -- *
          else
            pre=()
            if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
            gh release create "$TAG" --draft --verify-tag --title "$title" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** is ready to check and publish:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
