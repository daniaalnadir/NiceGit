name: Rust

"on":
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libssl-dev pkg-config

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked
