name: Windows clone check

# Clones through NiceGit's clone dialog on Windows under Git setups that can break signing or SSH,
# to reproduce a reported clone failure. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust
    shell: bash

jobs:
  clone:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        setup:
          - plain
          - empty-gpg-format
          - empty-gpg-format-signing
          - ssh-signing-missing-key
          - missing-gpg-program
          - x509-signing
          - https-github
          - ssh-bad-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Configure Git for this setup
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Clone Check"
          git config --global user.email "clone-check@example.invalid"
          case "${{ matrix.setup }}" in
            empty-gpg-format) git config --global gpg.format "" ;;
            empty-gpg-format-signing) git config --global gpg.format ""; git config --global commit.gpgsign true ;;
            ssh-signing-missing-key) git config --global gpg.format ssh; git config --global user.signingkey "C:/nonexistent/key.pub"; git config --global commit.gpgsign true ;;
            missing-gpg-program) git config --global gpg.program "C:/nonexistent/gpg.exe"; git config --global commit.gpgsign true ;;
            x509-signing) git config --global gpg.format x509; git config --global commit.gpgsign true ;;
            https-github) echo "NICEGIT_CLONE_URL=https://github.com/octocat/Hello-World.git" >> "$GITHUB_ENV" ;;
            ssh-bad-key)
              mkdir -p ~/.ssh
              printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\r\nnot a key\r\n-----END OPENSSH PRIVATE KEY-----\r\n' > ~/.ssh/id_ed25519
              ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
              echo "NICEGIT_CLONE_URL=git@github.com:octocat/Hello-World.git" >> "$GITHUB_ENV"
              ;;
          esac
          git config --global --list --show-origin

      - name: Plain git clone, for comparison
        continue-on-error: true
        run: |
          url="${NICEGIT_CLONE_URL:-}"
          if [ -n "$url" ]; then git clone -- "$url" "$RUNNER_TEMP/plain-clone"; else echo "local repository only"; fi

      - name: Clone through NiceGit
        run: cargo test --locked -p nicegit a_plain_clone_opens_without_an_error -- --nocapture
