[package]
name = "nicegit"
description = "A fast, cross-platform Git client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nicegit-core = { path = "../nicegit-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
egui-phosphor = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
notify = "8.2.0"
alacritty_terminal = "0.26.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Daniaal Nadir"
section = "vcs"
priority = "optional"
depends = "git, libgtk-3-0, libxkbcommon0"
extended-description = "NiceGit is a fast, cross-platform Git client with a commit graph, staging, branches, stashes, and merge and rebase tools."
assets = [
    ["target/release/nicegit", "usr/bin/", "755"],
    ["../../packaging/linux/nicegit.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/nicegit.png", "644"],
]
