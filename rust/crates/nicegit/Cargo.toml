[package]
name = "nicegit"
description = "A fast, cross-platform Git client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io. cargo-about skips unpublished crates in the third-party license file.
publish = false

[dependencies]
nicegit-core = { path = "../nicegit-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
egui-phosphor = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
notify = "8.2.0"
alacritty_terminal = "0.26.0"
# Pure-Rust regex (no C toolchain) with the default Sublime Text syntaxes and themes, for diff colours.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
notify-rust = "4"

# Windows machines without GPU drivers (virtual machines, Remote Desktop) lack the OpenGL 2.0
# the default renderer needs; wgpu draws through Direct3D 12, with a software fallback.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
tempfile = "3"

[package.metadata.deb]
maintainer = "Daniaal Nadir"
section = "vcs"
priority = "optional"
depends = "git, libgtk-3-0, libxkbcommon0, libxkbcommon-x11-0, libgl1, libegl1"
extended-description = "NiceGit is a fast, cross-platform Git client with a commit graph, staging, branches, stashes, and merge and rebase tools."
assets = [
    ["target/release/nicegit", "usr/bin/", "755"],
    ["../../packaging/linux/nicegit.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/nicegit.png", "644"],
    ["../../dist/THIRD_PARTY_LICENSES.txt", "usr/share/doc/nicegit/THIRD_PARTY_LICENSES.txt", "644"],
]

# The .rpm download, made by cargo-generate-rpm in rust/scripts/package-linux.sh. Library
# dependencies are found from the binary; Git is needed at run time.
[package.metadata.generate-rpm]
name = "nicegit"
summary = "A fast, free and open-source Git client"
url = "https://daniaalnadir.github.io/NiceGit/"
assets = [
    { source = "target/release/nicegit", dest = "/usr/bin/nicegit", mode = "755" },
    { source = "../../packaging/linux/nicegit.desktop", dest = "/usr/share/applications/nicegit.desktop", mode = "644" },
    { source = "../../assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/nicegit.png", mode = "644" },
    { source = "../../dist/THIRD_PARTY_LICENSES.txt", dest = "/usr/share/doc/nicegit/THIRD_PARTY_LICENSES.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"
